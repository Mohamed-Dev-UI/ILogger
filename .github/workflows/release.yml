# Release pipeline — triggered by pushing a version tag:
#
#     git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# Pipeline:
#   1. jvm     — full JVM build & test, publish all ilogger-* artifacts to
#                GitHub Packages (maven.pkg.github.com), collect the jars.
#   2. android — assemble the debug demo APK.
#   3. release — create the GitHub release with generated notes and attach
#                every library jar + the demo APK.
#
# GitHub Packages publication needs `packages: write`; the release steps need
# `contents: write` (both are declared at workflow level).

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch: # manual re-run (Actions → Release → Run workflow)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  jvm:
    name: JVM — test, publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caching + wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build & test all JVM modules
        run: >
          ./gradlew
          :ilogger-annotations:build
          :ilogger-core:build
          :ilogger-ksp:build
          :ilogger-testing:build
          :ilogger-room:build
          :ilogger-serialization:build
          :ilogger-ktor:build
          :ksp-tests:test
          :ksp-diagnostics:test
          :ksp-diagnostics-di:test
          :examples:basic:build
          :examples:room:build
          :examples:custom-sink:build
          :examples:server:build
          :examples:advanced-audit:build
          :benchmark:build

      - name: Publish to GitHub Packages (env-gated)
        # Target-specific publishing: the generic `publish` task now also
        # belongs to the Central pipeline and would require Central creds here.
        # GITHUB_TOKEN must be mapped explicitly — secrets are not auto-exported
        # to process env vars and the gradle script gates the repository on it.
        #
        # continue-on-error: GitHub Packages rejects re-publishing an identical
        # version (v* tag re-runs hit this after the first successful upload).
        # Central + the release-page jars remain the sources of truth, so a
        # duplicate rejection must not fail the release.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository

      - name: Publish + release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral

      - name: Collect library jars
        if: always()
        run: |
          mkdir -p dist
          find ilogger-*/build/libs -name '*.jar' -exec cp {} dist/ \;
          ls -la dist

      - name: Upload jars artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-jars
          path: dist/*.jar
          if-no-files-found: error

  android:
    name: Android — assembleDebug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No explicit SDK setup: ubuntu-latest ships the Android SDK with
      # licenses accepted; AGP auto-downloads missing platform/build-tools.
      - name: Set up Gradle (caching + wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Collect demo APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ILogger-demo-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-apk
          path: dist/ILogger-demo-debug.apk
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [jvm, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download library jars
        uses: actions/download-artifact@v4
        with:
          name: maven-jars
          path: maven-jars

      - name: Download demo APK
        uses: actions/download-artifact@v4
        with:
          name: demo-apk
          path: demo-apk

      - name: Create release and attach artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # no checkout in this job: gh needs explicit repo context
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # re-published tag: keep the existing release, replace assets
            gh release upload "$GITHUB_REF_NAME" \
              maven-jars/* demo-apk/* \
              --clobber
            # a pre-existing release may be a draft (created before this
            # policy); publishing is idempotent for already-public releases
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "ILogger $GITHUB_REF_NAME" \
              --generate-notes
            gh release upload "$GITHUB_REF_NAME" \
              maven-jars/* demo-apk/* \
              --clobber
          fi
